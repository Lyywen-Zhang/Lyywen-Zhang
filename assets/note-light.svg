<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -8 880 128" width="880" height="128" role="img" aria-labelledby="noteTitle noteDesc">
  <title id="noteTitle">Field Note</title>
  <desc id="noteDesc">Most of what I build starts out of curiosity and ends up somewhere in these repositories: small tools, rough prototypes, and notes kept along the way. Nothing is filed under a single label here. Feel free to look around and see what catches your eye.</desc>

  <style>
    .mono {
      font-family: ui-monospace, 'SFMono-Regular', 'Cascadia Mono', 'JetBrains Mono', Consolas, monospace;
    }
    .sans {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif;
    }
    .pill {
      fill: #f3f7fc;
      stroke: #cddbe9;
      stroke-width: 1;
    }
    .cursor {
      fill: #0284c7;
      font-family: ui-monospace, 'SFMono-Regular', 'Cascadia Mono', Consolas, monospace;
      font-weight: 700;
      animation: cursorBlink 2.2s steps(2, jump-none) infinite;
    }
    .trace-pulse {
      fill: none;
      stroke: #0284c7;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-dasharray: 18 90;
      animation: marginFlow 5.5s linear infinite;
    }
    @keyframes cursorBlink {
      0%, 100% { opacity: 0.95; }
      50% { opacity: 0.15; }
    }
    @keyframes marginFlow {
      from { stroke-dashoffset: 108; }
      to { stroke-dashoffset: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .cursor, .trace-pulse { animation: none; }
    }
  </style>

  <!-- Left Schematic Margin Rail & Index -->
  <g>
    <!-- Base Mitered Rail -->
    <path d="M 12 20 L 12 84 L 22 94 L 38 94" fill="none" stroke="#cfdbe8" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Subtle Flowing Blueprint Signal along Rail -->
    <path class="trace-pulse" pathLength="108" d="M 12 20 L 12 84 L 22 94 L 38 94" />
    <!-- Top Copper Via Terminal -->
    <circle cx="12" cy="20" r="3.2" fill="#ffffff" stroke="#c26a1b" stroke-width="1.4" />
    <circle cx="12" cy="20" r="1.1" fill="#c26a1b" />
    <!-- End Node -->
    <circle cx="38" cy="94" r="2" fill="#b6c7da" />

    <!-- Margin Silkscreen Label -->
    <text class="mono" x="26" y="23.5" font-size="9.5" fill="#6b8098" letter-spacing="1.2">NOTE // 01</text>
    <text class="mono" x="26" y="38" font-size="8.5" fill="#94a7bd" letter-spacing="0.9">README.LOG</text>
  </g>

  <!-- Right Editorial Content -->
  <g>
    <!-- Lead Sentence -->
    <text class="sans" x="122" y="24" font-size="14.8" font-weight="400" fill="#1e293b" letter-spacing="0.05">
      Most of what I build starts out of curiosity and ends up somewhere in these repositories:
    </text>

    <!-- Tactile Blueprint Specimen Chips -->
    <!-- Chip 1: small tools -->
    <g transform="translate(122, 38)">
      <rect class="pill" x="0" y="0" width="120" height="26" rx="5" />
      <rect x="10" y="8" width="10" height="10" rx="2" fill="none" stroke="#0284c7" stroke-width="1.2" />
      <line x1="13" y1="11.5" x2="15.5" y2="13" stroke="#0284c7" stroke-width="1.1" stroke-linecap="round" />
      <line x1="13" y1="14.5" x2="15.5" y2="13" stroke="#0284c7" stroke-width="1.1" stroke-linecap="round" />
      <text class="mono" x="27" y="16.8" font-size="11.5" fill="#2c3e50" letter-spacing="0.2">small tools</text>
    </g>

    <!-- Chip 2: rough prototypes -->
    <g transform="translate(252, 38)">
      <rect class="pill" x="0" y="0" width="160" height="26" rx="5" />
      <path d="M 10 16 L 14 12 L 19 12" fill="none" stroke="#c26a1b" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="10" cy="16" r="1.5" fill="#c26a1b" />
      <circle cx="19.5" cy="12" r="2" fill="none" stroke="#c26a1b" stroke-width="1.2" />
      <text class="mono" x="28" y="16.8" font-size="11.5" fill="#2c3e50" letter-spacing="0.2">rough prototypes</text>
    </g>

    <!-- Chip 3: notes kept along the way -->
    <g transform="translate(422, 38)">
      <rect class="pill" x="0" y="0" width="216" height="26" rx="5" />
      <line x1="10" y1="9.5" x2="20" y2="9.5" stroke="#0284c7" stroke-width="1.2" stroke-linecap="round" />
      <line x1="10" y1="13" x2="18" y2="13" stroke="#0284c7" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.75" />
      <line x1="10" y1="16.5" x2="15.5" y2="16.5" stroke="#0284c7" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.5" />
      <text class="mono" x="27" y="16.8" font-size="11.5" fill="#2c3e50" letter-spacing="0.2">notes kept along the way</text>
    </g>

    <!-- Closing Invitation Sentence + Breathing Cursor -->
    <text class="sans" x="122" y="92" font-size="14.2" font-weight="400" fill="#52657a" letter-spacing="0.05">
      Nothing is filed under a single label here. Feel free to look around and see what catches your eye.<tspan class="cursor" dx="5">_</tspan>
    </text>
  </g>
</svg>
