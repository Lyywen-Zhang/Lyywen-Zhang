<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 248" width="880" height="248" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">Lyywen Zhang / Levin_z</title>
  <desc id="bannerDesc">Notes, experiments, and working things.</desc>

  <defs>
    <linearGradient id="boardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="55%" stop-color="#f3f7fb" />
      <stop offset="100%" stop-color="#eef3f9" />
    </linearGradient>

    <radialGradient id="schematicGlow" cx="78%" cy="50%" r="42%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.07" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#eef3f9" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="gridFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="42%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="75%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.75" />
    </linearGradient>

    <mask id="gridMask">
      <rect x="13" y="13" width="854" height="222" rx="6" fill="url(#gridFade)" />
    </mask>

    <pattern id="microGrid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#cbd8e6" stroke-width="0.6" stroke-opacity="0.55" />
    </pattern>

    <pattern id="majorGrid" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect width="80" height="80" fill="url(#microGrid)" />
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#b6c7da" stroke-width="0.8" stroke-opacity="0.7" />
    </pattern>

    <linearGradient id="chipSurface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#edf2f8" />
    </linearGradient>

    <clipPath id="cardClip">
      <rect x="1" y="1" width="878" height="246" rx="10" />
    </clipPath>

    <g id="fiducial">
      <circle cx="0" cy="0" r="5.5" fill="none" stroke="#94a8be" stroke-width="0.8" />
      <line x1="-8.5" y1="0" x2="-3.5" y2="0" stroke="#94a8be" stroke-width="0.8" />
      <line x1="3.5" y1="0" x2="8.5" y2="0" stroke="#94a8be" stroke-width="0.8" />
      <line x1="0" y1="-8.5" x2="0" y2="-3.5" stroke="#94a8be" stroke-width="0.8" />
      <line x1="0" y1="3.5" x2="0" y2="8.5" stroke="#94a8be" stroke-width="0.8" />
      <circle cx="0" cy="0" r="1.6" fill="#c26a1b" />
    </g>

    <g id="via">
      <circle cx="0" cy="0" r="3.4" fill="#f8fafc" stroke="#c26a1b" stroke-width="1.35" />
      <circle cx="0" cy="0" r="1.3" fill="#cbd5e1" />
    </g>

    <g id="testpoint">
      <circle cx="0" cy="0" r="4.6" fill="#ffffff" stroke="#c26a1b" stroke-width="1.5" />
      <circle cx="0" cy="0" r="1.7" fill="#0284c7" fill-opacity="0.9" />
    </g>
  </defs>

  <style>
    .mono {
      font-family: ui-monospace, 'SFMono-Regular', 'Cascadia Mono', 'JetBrains Mono', Consolas, monospace;
    }
    .sans {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif;
    }
    .trace-base {
      fill: none;
      stroke: #c4d3e3;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .trace-secondary {
      fill: none;
      stroke: #d3dfec;
      stroke-width: 1.25;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .signal-glow {
      fill: none;
      stroke: #0284c7;
      stroke-width: 3.4;
      stroke-opacity: 0.18;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 44 356;
      animation: pulseFlow 7.5s linear infinite;
    }
    .signal-core {
      fill: none;
      stroke: #0284c7;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 44 356;
      animation: pulseFlow 7.5s linear infinite;
    }
    .delay-b {
      animation-delay: -2.5s;
    }
    .delay-c {
      animation-delay: -5s;
    }
    .die-beacon {
      animation: dieBreath 3.75s ease-in-out infinite;
    }
    .status-led {
      animation: ledBreath 4.5s ease-in-out infinite;
    }
    @keyframes pulseFlow {
      from { stroke-dashoffset: 400; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes dieBreath {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 1; }
    }
    @keyframes ledBreath {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .signal-glow, .signal-core, .die-beacon, .status-led {
        animation: none;
      }
      .signal-glow { stroke-dashoffset: 190; }
      .signal-core { stroke-dashoffset: 190; }
    }
  </style>

  <g clip-path="url(#cardClip)">
    <!-- Archival Blueprint Substrate -->
    <rect x="1" y="1" width="878" height="246" rx="10" fill="url(#boardBg)" />
    <rect x="1" y="1" width="878" height="246" rx="10" fill="url(#schematicGlow)" />

    <!-- Blueprint Grid -->
    <rect x="13" y="13" width="854" height="222" fill="url(#majorGrid)" mask="url(#gridMask)" />

    <!-- Silkscreen Courtyard Frame -->
    <rect x="13" y="13" width="854" height="222" rx="6" fill="none" stroke="#cedae8" stroke-width="0.85" />

    <!-- Vernier Scale Ticks (Top & Bottom Silkscreen) -->
    <g stroke="#bccbe0" stroke-width="0.75">
      <line x1="96" y1="13" x2="96" y2="17" />
      <line x1="176" y1="13" x2="176" y2="19" />
      <line x1="256" y1="13" x2="256" y2="17" />
      <line x1="336" y1="13" x2="336" y2="19" />
      <line x1="416" y1="13" x2="416" y2="17" />
      <line x1="496" y1="13" x2="496" y2="19" />
      <line x1="576" y1="13" x2="576" y2="17" />
      <line x1="656" y1="13" x2="656" y2="19" />
      <line x1="736" y1="13" x2="736" y2="17" />

      <line x1="96" y1="231" x2="96" y2="235" />
      <line x1="176" y1="229" x2="176" y2="235" />
      <line x1="256" y1="231" x2="256" y2="235" />
      <line x1="336" y1="229" x2="336" y2="235" />
      <line x1="416" y1="231" x2="416" y2="235" />
      <line x1="496" y1="229" x2="496" y2="235" />
      <line x1="576" y1="231" x2="576" y2="235" />
      <line x1="656" y1="229" x2="656" y2="235" />
      <line x1="736" y1="231" x2="736" y2="235" />
    </g>

    <!-- Corner Optical Fiducials -->
    <use href="#fiducial" x="29" y="29" />
    <use href="#fiducial" x="851" y="29" />
    <use href="#fiducial" x="29" y="219" />
    <use href="#fiducial" x="851" y="219" />

    <!-- ================= RIGHT ZONE: 45-DEGREE PCB ROUTING & QFN CORE ================= -->
    <g>
      <path class="trace-secondary" d="M 683 56 L 693 66 L 693 88" />
      <path class="trace-secondary" d="M 713 58 L 713 88" />
      <path class="trace-secondary" d="M 743 58 L 733 68 L 733 88" />
      <path class="trace-secondary" d="M 683 192 L 693 182 L 693 160" />
      <path class="trace-secondary" d="M 713 190 L 713 160" />
      <path class="trace-secondary" d="M 743 190 L 733 180 L 733 160" />

      <path class="trace-base" d="M 525 69 L 605 69 L 635 99 L 771 99 L 795 75 L 822 75" />
      <path class="trace-base" d="M 495 79 L 601 79 L 631 109 L 776 109 L 794 91 L 808 91" />
      <path class="trace-base" d="M 468 119 L 828 119" />
      <path class="trace-base" d="M 492 129 L 796 129" />
      <path class="trace-base" d="M 505 169 L 601 169 L 631 139 L 776 139 L 794 157 L 808 157" />
      <path class="trace-base" d="M 535 179 L 605 179 L 635 149 L 771 149 L 795 173 L 822 173" />
    </g>

    <!-- Animated Signal Packets -->
    <g>
      <path class="signal-glow" pathLength="400" d="M 525 69 L 605 69 L 635 99 L 771 99 L 795 75 L 822 75" />
      <path class="signal-core" pathLength="400" d="M 525 69 L 605 69 L 635 99 L 771 99 L 795 75 L 822 75" />

      <path class="signal-glow delay-b" pathLength="400" d="M 468 119 L 828 119" />
      <path class="signal-core delay-b" pathLength="400" d="M 468 119 L 828 119" />

      <path class="signal-glow delay-c" pathLength="400" d="M 535 179 L 605 179 L 635 149 L 771 149 L 795 173 L 822 173" />
      <path class="signal-core delay-c" pathLength="400" d="M 535 179 L 605 179 L 635 149 L 771 149 L 795 173 L 822 173" />
    </g>

    <!-- QFN-24 Brushed Copper Landing Pads -->
    <g fill="#c26a1b">
      <rect x="665" y="97.5" width="7" height="3" rx="1" />
      <rect x="665" y="107.5" width="7" height="3" rx="1" />
      <rect x="665" y="117.5" width="7" height="3" rx="1" />
      <rect x="665" y="127.5" width="7" height="3" rx="1" />
      <rect x="665" y="137.5" width="7" height="3" rx="1" />
      <rect x="665" y="147.5" width="7" height="3" rx="1" />

      <rect x="744" y="97.5" width="7" height="3" rx="1" />
      <rect x="744" y="107.5" width="7" height="3" rx="1" />
      <rect x="744" y="117.5" width="7" height="3" rx="1" />
      <rect x="744" y="127.5" width="7" height="3" rx="1" />
      <rect x="744" y="137.5" width="7" height="3" rx="1" />
      <rect x="744" y="147.5" width="7" height="3" rx="1" />

      <rect x="681.5" y="81" width="3" height="7" rx="1" />
      <rect x="691.5" y="81" width="3" height="7" rx="1" />
      <rect x="701.5" y="81" width="3" height="7" rx="1" />
      <rect x="711.5" y="81" width="3" height="7" rx="1" />
      <rect x="721.5" y="81" width="3" height="7" rx="1" />
      <rect x="731.5" y="81" width="3" height="7" rx="1" />

      <rect x="681.5" y="160" width="3" height="7" rx="1" />
      <rect x="691.5" y="160" width="3" height="7" rx="1" />
      <rect x="701.5" y="160" width="3" height="7" rx="1" />
      <rect x="711.5" y="160" width="3" height="7" rx="1" />
      <rect x="721.5" y="160" width="3" height="7" rx="1" />
      <rect x="731.5" y="160" width="3" height="7" rx="1" />
    </g>

    <!-- Central QFN Package U1 -->
    <g>
      <rect x="672" y="88" width="72" height="72" rx="6" fill="url(#chipSurface)" stroke="#9fb3c8" stroke-width="1.2" />
      <path d="M 668 83 L 668 78 L 673 78 M 743 78 L 748 78 L 748 83 M 668 165 L 668 170 L 673 170 M 743 170 L 748 170 L 748 165"
            fill="none" stroke="#94a8be" stroke-width="0.9" />
      <rect x="686" y="102" width="44" height="44" rx="3" fill="#f8fafc" stroke="#cbd8e6" stroke-width="0.9" />
      <circle cx="680" cy="96" r="1.8" fill="#c26a1b" />
      <line x1="693" y1="109" x2="701" y2="117" stroke="#b6c7da" stroke-width="1" />
      <line x1="723" y1="109" x2="715" y2="117" stroke="#b6c7da" stroke-width="1" />
      <line x1="693" y1="139" x2="701" y2="131" stroke="#b6c7da" stroke-width="1" />
      <line x1="723" y1="139" x2="715" y2="131" stroke="#b6c7da" stroke-width="1" />
      <circle cx="708" cy="124" r="9.5" fill="none" stroke="#0284c7" stroke-width="1.1" stroke-opacity="0.6" />
      <circle class="die-beacon" cx="708" cy="124" r="3.2" fill="#c26a1b" />
    </g>

    <!-- Plated Through-Hole Vias & Test Points -->
    <g>
      <use href="#via" x="525" y="69" />
      <use href="#via" x="495" y="79" />
      <use href="#via" x="468" y="119" />
      <use href="#via" x="564" y="119" />
      <use href="#via" x="492" y="129" />
      <use href="#via" x="505" y="169" />
      <use href="#via" x="535" y="179" />

      <use href="#via" x="683" y="56" />
      <use href="#via" x="713" y="58" />
      <use href="#via" x="743" y="58" />
      <use href="#via" x="683" y="192" />
      <use href="#via" x="713" y="190" />
      <use href="#via" x="743" y="190" />

      <use href="#via" x="808" y="91" />
      <use href="#via" x="796" y="129" />
      <use href="#via" x="808" y="157" />

      <use href="#testpoint" x="822" y="75" />
      <use href="#testpoint" x="828" y="119" />
      <use href="#testpoint" x="822" y="173" />
    </g>

    <!-- Subtle Component Designators -->
    <g class="mono" font-size="8" fill="#7c90a6" letter-spacing="0.8">
      <text x="676" y="74">U1</text>
      <text x="822" y="64" text-anchor="middle">TP1</text>
      <text x="828" y="108" text-anchor="middle">TP2</text>
      <text x="822" y="190" text-anchor="middle">TP3</text>
    </g>

    <!-- ================= LEFT ZONE: SILKSCREEN NAMEPLATE & COPY ================= -->
    <g class="mono" font-size="9.5" fill="#788ba0" letter-spacing="1.2">
      <text x="48" y="32">SCH-01 // FIELD PLATE</text>
      <text x="832" y="32" text-anchor="end">@LYYWEN-ZHANG</text>
      <text x="48" y="222">OPEN ARCHIVE</text>
      <text x="832" y="222" text-anchor="end">REV 2026</text>
    </g>

    <path d="M 52 68 L 52 61 L 59 61" fill="none" stroke="#9fb3c8" stroke-width="1" />

    <circle class="status-led" cx="60" cy="82" r="2.6" fill="#c26a1b" />
    <text class="mono" x="71" y="85.5" font-size="11" fill="#5b7087" letter-spacing="1.6">LEVIN_Z</text>

    <text class="sans" x="54" y="130" font-size="38" font-weight="600" fill="#0f172a" letter-spacing="-0.7">Lyywen Zhang</text>

    <line x1="56" y1="146" x2="112" y2="146" stroke="#0284c7" stroke-width="1.4" stroke-opacity="0.75" />
    <line x1="118" y1="146" x2="296" y2="146" stroke="#d5e0ec" stroke-width="1" />

    <text class="sans" x="56" y="171" font-size="14.5" font-weight="400" fill="#52657a" letter-spacing="0.1">Notes, experiments, and working things.</text>
  </g>

  <rect x="1" y="1" width="878" height="246" rx="10" fill="none" stroke="#cfdbe8" stroke-width="1.2" />
</svg>
